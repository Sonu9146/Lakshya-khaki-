      - name: Extract Project ZIP
        run: |
          # 1. repo मधील ZIP फाईल शोधणे (नावातील लहान/मोठ्या अक्षरांमुळे होणारा फरक टाळण्यासाठी)
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Found zip file: $ZIP_FILE"
          
          # 2. Unzip करणे
          unzip "$ZIP_FILE" -d extracted_project
          
          # 3. फाईल्स root डिरेक्टरीमध्ये मूव्ह करणे
          if [ -d "extracted_project" ]; then
            # जर zip मध्ये सब-फोल्डर असेल तर आतील कंटेंट बाहेर काढणे
            INSIDE_DIR=$(find extracted_project -maxdepth 1 -type d | tail -n +2 | head -n 1)
            if [ -n "$INSIDE_DIR" ]; then
              cp -r "$INSIDE_DIR"/* . || true
              cp -r "$INSIDE_DIR"/.* . 2>/dev/null || true
            else
              cp -r extracted_project/* . || true
              cp -r extracted_project/.* . 2>/dev/null || true
            fi
          fi
          
          # 4. चेक करणे की gradlew फाईल बाहेर आली का
          ls -la
