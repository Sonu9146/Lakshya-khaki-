name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Source Code
      run: |
        unzip -o *.zip -d .
        rm -f *.zip

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    - name: Fix AndroidX, Jetifier and Java Version
      run: |
        # AndroidX ऑन करणे
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        # जावा व्हर्जन मिसमॅच फिक्स करण्यासाठी ग्लोबल सेटिंग जोडणे
        echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties

    - name: Grant execute permission for gradlew
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        fi

    - name: Build with Gradle (Force JVM 17)
      run: |
        # -Porg.gradle.java.home द्वारे जावा १७ सक्तीने लागू करणे
        if [ -f gradlew ]; then
          ./gradlew assembleDebug -Pandroid.injected.kotlin.zapt.jvm.target=17 -Porg.gradle.java.home=$JAVA_HOME --no-daemon
        else
          gradle assembleDebug -Pandroid.injected.kotlin.zapt.jvm.target=17 -Porg.gradle.java.home=$JAVA_HOME --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
