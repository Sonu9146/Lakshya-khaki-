name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Project ZIP
        run: |
          unzip LakshyaKhaki-Native-v12.zip -d extracted_project
          # find gradlew in extracted files and move everything to root if inside a subfolder
          if [ -d "extracted_project" ]; then
            cp -r extracted_project/* . || true
            cp -r extracted_project/.* . || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew still not found!"
            ls -la
            exit 1
          fi

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-debug
          path: app/build/outputs/apk/debug/*.apk
