name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Source Code
      run: |
        unzip -o *.zip -d .
        rm -f *.zip

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    - name: Fix AndroidX and JVM Target in Build Scripts
      run: |
        # 1. Enable AndroidX Support across the project
        find . -name "gradle.properties" -exec sh -c 'echo "android.useAndroidX=true" >> "$1"' _ {} \;
        find . -name "gradle.properties" -exec sh -c 'echo "android.enableJetifier=true" >> "$1"' _ {} \;
        
        # 2. Force JVM 17 in all build.gradle.kts files found in subdirectories
        find . -name "build.gradle.kts" -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} \;
        find . -name "build.gradle.kts" -exec sed -i 's/"1.8"/"17"/g' {} \;
        find . -name "build.gradle.kts" -exec sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' {} \;

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build with Gradle
      run: |
        # Find gradlew wherever it is and run it
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -f "$GRADLEW_PATH" ]; then
          cd "$(dirname "$GRADLEW_PATH")"
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug
        path: "**/*.apk"
