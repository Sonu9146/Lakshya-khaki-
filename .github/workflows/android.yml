name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Found zip file: $ZIP_FILE"
          unzip "$ZIP_FILE" -d extracted_project
          if [ -d "extracted_project" ]; then
            INSIDE_DIR=$(find extracted_project -maxdepth 1 -type d | tail -n +2 | head -n 1)
            if [ -n "$INSIDE_DIR" ]; then
              cp -r "$INSIDE_DIR"/* . || true
              cp -r "$INSIDE_DIR"/.* . 2>/dev/null || true
            else
              cp -r extracted_project/* . || true
              cp -r extracted_project/.* . 2>/dev/null || true
            fi
          fi
          ls -la

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew not found!"
            exit 1
          fi

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-debug
          path: app/build/outputs/apk/debug/*.apk
