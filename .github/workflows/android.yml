name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Source Code
      run: |
        unzip -o *.zip -d .
        rm -f *.zip

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    - name: Fix AndroidX and JVM Target in Build Scripts
      run: |
        # 1. Enable AndroidX Support
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties

        # 2. Automatically replace Java 1.8 with Java 17 inside app/build.gradle.kts
        GRADLE_FILE="app/build.gradle.kts"
        if [ -f "$GRADLE_FILE" ]; then
          echo "Modifying $GRADLE_FILE to force JVM 17..."
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$GRADLE_FILE"
          sed -i 's/"1.8"/"17"/g' "$GRADLE_FILE"
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$GRADLE_FILE"
        fi

    - name: Grant execute permission for gradlew
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        fi

    - name: Build with Gradle
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug
        path: "**/outputs/apk/debug/*.apk"
